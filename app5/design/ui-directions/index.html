<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>伸展 · 三款設計方向</title>
<style>

(--muted)}.hero h3{font-size:23px;margin:14px 0 7px;letter-spacing:-.5px}.meta{font-size:11px;color:var(--muted)}.go{position:absolute;bottom:20px;right:20px;width:34px;height:34px;background:var(--accent);color:var(--on);border-radius:50%;display:grid;place-items:center}.art{position:absolute;right:-5px;top:-6px;width:142px;height:142px;color:var(--accent);opacity:.85}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);padding:15px;border-radius:18px;min-height:102px}.tile b{font-size:14px;display:block;margin:7px 0}.tile small{font-size:10px;color:var(--muted)}.tile .symbol{color:var(--accent);font-size:20px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips span{border:1px solid var(--line);border-radius:20px;padding:9px 13px;font-size:11px}.homebar{position:absolute;bottom:9px;left:35%;width:30%;height:4px;background:var(--ink);opacity:.8;border-radius:8px}.a{--bg:#faf9f5;--ink:#253e32;--muted:#68766a;--accent:#3d6450;--on:#fff;--tint:#e6ebdf;--line:#dde2d7}.b{--bg:#f5f7fc;--ink:#172d4f;--muted:#63768d;--accent:#225ce0;--on:#fff;--tint:#e1eaff;--line:#dbe3f2}.c{--bg:#fff7e9;--ink:#3b3028;--muted:#837060;--accent:#ba4b2c;--on:#fff7e9;--tint:#f8ddbd;--line:#e8d8c5}.b .headline{font-size:39px;font-weight:750}.b .hero{background:#225ce0;color:white;border-radius:13px;height:190px}.b .hero small,.b .hero .meta{color:#dce6ff}.b .hero h3{font-size:27px}.b .go{background:white;color:#225ce0;border-radius:10px}.b .art{color:#b7d4ff;right:0;top:26px}.b .tile{background:white;border:none;border-radius:12px}.b .chips span{background:#fff;border:none;border-radius:8px}.b .section{margin-top:22px}.c .headline{font-size:43px;line-height:1.2;font-family:"Songti TC",serif;font-weight:600;margin-bottom:23px}.c .hero{border-radius:80px 80px 18px 18px;height:184px;padding:35px 22px 20px}.c .hero h3{font-family:"Songti TC",serif;font-size:26px}.c .art{top:8px;right:4px}.list .row{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}.list .row b{font-size:14px;display:block;margin-bottom:4px}.list .row small{font-size:10px;color:var(--muted)}.idx{font-size:11px;color:var(--accent)}.row .arr{margin-left:auto;color:var(--accent)}.c .section{margin-top:20px}.c .chips span{background:#f2e9db;border:none;border-radius:9px}.back{font-size:13px;margin:4px 0 25px;display:flex;gap:13px;align-items:center}.preview h2{font-size:31px;letter-spacing:-1px;margin:8px 0 20px}.stats{display:flex;gap:0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}.stats>div{width:50%}.stats>div+div{border-left:1px solid var(--line);padding-left:25px}.stats b{font-size:29px;font-weight:500}.stats small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.exercise{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.exercise .thumb{width:49px;height:49px;border-radius:13px;background:var(--tint);color:var(--accent);display:grid;place-items:center}.exercise b{font-size:13px;display:block;margin-bottom:5px}.exercise small{font-size:10px;color:var(--muted)}.handle{margin-left:auto;color:var(--muted);font-size:20px}.action{position:absolute;bottom:29px;left:22px;right:22px;padding:17px;background:var(--accent);border:0;color:var(--on);font-size:14px;border-radius:18px;text-align:center;font-weight:600}.b .stats{background:var(--tint);border:0;padding:20px;border-radius:14px}.b .exercise{background:white;margin-bottom:8px;border:0;border-radius:12px;padding:10px}.b .action{border-radius:12px}.c .preview h2{font-family:"Songti TC",serif;font-size:38px}.c .stats{border-top:0;padding-top:2px}.c .action{border-radius:40px}.preview{display:none}.show-preview .home{display:none}.show-preview .preview{display:block}.c .thumb{border-radius:50%}.phone svg{overflow:visible}footer{padding:0 34px 35px;max-width:1240px;margin:auto;font-size:12px;color:#67716b}@media(max-width:1000px){main{gap:16px;padding:0 16px 30px}.content{padding-left:17px;padding-right:17px}.phone{height:790px;border-width:4px}.headline{font-size:31px}.b .headline{font-size:33px}.c .headline{font-size:36px}.tile{padding:12px}.hero{padding:19px}.art{width:115px}.hero h3{font-size:21px}.b .hero h3{font-size:23px}}@media(max-width:760px){main{grid-template-columns:1fr;max-width:410px;gap:32px}.phone{height:780px}.content{padding-left:22px;padding-right:22px}.art{width:142px}.headline{font-size:36px}.b .headline{font-size:39px}.c .headline{font-size:43px}header{padding:28px 22px}header h1{font-size:27px}}
.phone{height:900px}.content{height:calc(100% - 46px);overflow-y:auto;scrollbar-width:none;padding-bottom:35px}.content::-webkit-scrollbar{display:none}.preview{padding-bottom:110px}</style></head><body>
<header><small>STRETCH / DESIGN EXPLORATION 01</small><h1>伸展，換一種舒服的樣子。</h1><p>三個方向 · 相同內容與流程 · 首頁 / 組合預覽</p><nav aria-label="切換畫面"><button class="active" data-page="home" aria-pressed="true">首頁</button><button data-page="preview" aria-pressed="false">組合預覽</button></nav></header>
<main id="designs"></main><footer>設計提案 A / B / C · 預覽時間為活動時間 · 三款皆保留動作排序</footer>
<script>
const stretchArt=`<svg viewBox="0 0 160 160" fill="none" aria-hidden="true"><circle cx="84" cy="78" r="62" fill="currentColor" opacity=".09"/><path d="M31 125C42 116 61 117 69 104M97 102C108 115 122 119 137 120" stroke="currentColor" stroke-width="2" opacity=".25"/><circle cx="84" cy="44" r="11" fill="currentColor"/><path d="M83 65L73 96L57 127M74 95L98 124M82 68L57 77L38 62M83 67L107 52L119 27" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 39L129 28M130 47L141 42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const mini=`<svg width="32" height="36" viewBox="0 0 40 44" fill="none" aria-hidden="true"><circle cx="20" cy="7" r="4" fill="currentColor"/><path d="M20 16V29M20 19L8 14M20 19L32 12M20 29L12 39M20 29L28 39" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;
const dirs=[{id:'a',name:'A · 靜心日常',desc:'暖白 × 鼠尾草綠。留白、細線、柔和的卡片。',head:'把時間，<br>留給身體。'},{id:'b',name:'B · 輕快動能',desc:'冷白 × 鈷藍。鮮明主卡片、模組化入口。',head:'伸展一下。'},{id:'c',name:'C · 溫暖生活',desc:'奶油 × 陶土橘。襯線標題、拱形插畫、清爽清單。',head:'慢一點，<br>鬆一點。'}];
const combos=[['原地伸展','站著 · 8 個動作 · 4 分鐘','↟'],['辦公室伸展','坐著 · 8 個動作 · 4 分鐘','⌑'],['晨起喚醒','站著 · 6 個動作 · 3 分鐘','☼'],['睡前放鬆','躺著 · 8 個動作 · 4 分鐘','☾']];
const exercises=['頸部轉動','肩膀繞圈','胸口打開','手肘彎伸','手腕伸展','手指張合','站姿側滑','肩胛活動'];
const chips='<div class="chips"><span>頸部</span><span>肩膀</span><span>胸口</span><span>腰背</span><span>手臂</span><span>手腕</span><span>髖臀</span><span>腿部</span></div>';
document.getElementById('designs').innerHTML=dirs.map(d=>`<article><h2>${d.name}</h2><p>${d.desc}</p><div class="phone ${d.id}"><div class="safe"><span>9:41</span><div class="island"></div><span>● ▰</span></div><div class="content home"><div class="top"><span class="brand">伸展 STRETCH</span><span class="gear" aria-label="設定">⚙</span></div><p class="eyebrow">${d.id==='b'?'MOVE A LITTLE, FEEL BETTER':'A LITTLE SPACE FOR YOU'}</p><h2 class="headline">${d.head}</h2><div class="hero"><small>上次使用</small><div class="art">${stretchArt}</div><h3>原地伸展</h3><div class="meta">8 個動作 · 4 分鐘</div><span class="go">↗</span></div><div class="section">${d.id==='c'?'挑一組，開始吧':'伸展組合'}<span>共 6 組</span></div>${d.id==='c'?'<div class="list">'+combos.slice(0,3).map((c,i)=>`<div class="row"><span class="idx">0${i+1}</span><div><b>${c[0]}</b><small>${c[1]}</small></div><span class="arr">↗</span></div>`).join('')+'</div>':'<div class="grid">'+combos.map(c=>`<div class="tile"><span class="symbol">${c[2]}</span><b>${c[0]}</b><small>${c[1].split(' · ').slice(1).join(' · ')}</small></div>`).join('')+'</div>'}<div class="section">依部位<span>找到想放鬆的地方</span></div>${chips}</div><div class="content preview"><div class="back">← <span>組合預覽</span></div><p class="eyebrow">STANDING / 01</p><h2>原地伸展</h2><div class="stats"><div><b>04:00</b><small>活動時間</small></div><div><b>08</b><small>動作 · 每個 30 秒</small></div></div><div class="section">動作順序<span>8 個動作</span></div>${exercises.map((e,i)=>`<div class="exercise"><div class="thumb">${mini}</div><div><b>${String(i+1).padStart(2,'0')} · ${e}</b><small>30 秒</small></div><span class="handle">⠿</span></div>`).join('')}<div class="action">開始跟練　→</div></div><div class="homebar"></div></div></article>`).join('');

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('show-preview',b.dataset.page==='preview');document.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});}));
if(location.hash==='#preview')document.querySelector('[data-page=preview]').click();
</script></body></html>
